[project]
name = "brink-flair"
version = "0.1.0"
description = "Home Assistant integration for Brink Flair ventilation units"
requires-python = ">=3.14.2"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component",
  "pytest-cov",
  # Requirements of the modbus and usb integrations this one depends on.
  "modbus-connection[tmodbus]==4.12.7",
  "pymodbus==3.13.1",
  "tmodbus==1.1.0",
  "aiousbwatcher==1.1.2",
  "serialx==1.11.0",
  "ruff",
  "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D", "PL"]
ignore = ["D203", "D213", "PLR2004", "PLR0913", "E501", "RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.brink_flair"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR"]
